services:
  mariadb:
    build: ./requirements/mariadb
    env_file: .env
    restart: unless-stopped
    secrets:
      - db_user
      - db_password
      - db_root_password
    expose: 
      - "3306"
    volumes:
      - db_vol:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    env_file: .env
    restart: on-failure
    expose:
      - "9000"
    volumes:
      - wp_vol:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb

  nginx:
    build: ./requirements/nginx
    env_file: .env
    restart: on-failure
    ports:
      - "443:443" # El puerto del contenedor se mapea al del host
    volumes:
      - wp_vol:/var/www/html # Comparte volumen con wordpress con el contenido de este ultimo
      - ./requirements/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - inception
    depends_on:
      - wordpress # Hasta que wordpress no este listo no se arrancara nginx

volumes:
  db_vol:
    driver: local
    driver_opts:
      type: none # No se define un sistema de archivos especifico
      device: "/home/${USER}/mydata/db_vol" # directorio del host donde se va a montar
      o: bind # Mapea una carpeta del host a dentro del contenedor.

  wp_vol:
    driver: local
    driver_opts:
      type: none
      device: "/home/${USER}/mydata/wp_vol"
      o: bind

networks:
  inception:
    driver: bridge

secrets:
  db_user:
    file: ../secrets/db_user.txt
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt