services:
  mariadb:
#    image: mariadb
#    container_name: mariadb
    build: ./requirements/mariadb
    env_file: .env
    restart: unless-stopped
    expose: 
      - "3306"
    volumes:
      - db_vol:/var/lib/mysql
    networks:
      - inception

  nginx:
#    image: nginx
#    container_name: nginx
    build: ./requirements/nginx
    env_file: .env
    restart: on-failure
    ports:
      - "443:443" # El puerto del contenedor se mapea al del host
#    volumes:
#      - wp_vol:/var/www/html
#      - ./requirements/nginx/conf:/etc/nginx/conf.d
    volumes:
      - wp_vol:/var/www/html
      - ./requirements/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf

    networks:
      - inception
    depends_on:
      - wordpress

  wordpress:
#    image: wordpress
#    container_name: wordpress
    build: ./requirements/wordpress
    env_file: .env
    restart: on-failure
    expose:
      - "9000"
    volumes:
      - wp_vol:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb

volumes:
  db_vol:
    driver: local
    driver_opts:
      type: none # No se define un sistema de archivos especifico
      device: "/home/${USER}/mydata/db_vol" # directorio del host donde se va a montar
      o: bind # Mapea una carpeta del host a dentro del contenedor.

  wp_vol:
    driver: local
    driver_opts:
      type: none
      device: "/home/${USER}/mydata/wp_vol"
      o: bind

networks:
  inception:
    driver: bridge

