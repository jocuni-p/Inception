services:
  mariadb:
    build: ./requirements/mariadb
    env_file: .env # defino el archivo externo de las variables de entorno que se inyectaran al container
    restart: always
    expose: 
      - "3306"
    volumes:
      - db_vol:/var/lib/mysql
      - ../secrets/db_user.txt:/run/secrets/db_user:ro # read only
      - ../secrets/db_password.txt:/run/secrets/db_password:ro
      - ../secrets/db_root_password.txt:/run/secrets/db_root_password:ro
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/wp-login.php"]
      interval: 10s
      timeout: 5s
      retries: 5 
    expose:
      - "9000"
    volumes:
      - wp_vol:/var/www/html
      - ../secrets/db_user.txt:/run/secrets/db_user:ro # read only
      - ../secrets/db_password.txt:/run/secrets/db_password:ro
      - ../secrets/wp_admin_user.txt:/run/secrets/wp_admin_user:ro
      - ../secrets/wp_admin_password.txt:/run/secrets/wp_admin_password:ro
      - ../secrets/wp_admin_email.txt:/run/secrets/wp_admin_email:ro
      - ../secrets/wp_user.txt:/run/secrets/wp_user:ro
      - ../secrets/wp_user_password.txt:/run/secrets/wp_user_password:ro
      - ../secrets/wp_user_email.txt:/run/secrets/wp_user_email:ro
    networks:
      - inception
    depends_on: # solo controla el orden de inicio, no si su servicio interno ya esta 100% operativo.
      mariadb:
        condition: service_healthy # espera a que el healthcheck de mariadb pase el 'exit 0' 

  nginx:
    build: ./requirements/nginx
    env_file: .env # solo si voy a necesitar alguna variable de env
    restart: always
    healthcheck: # uso --inecure porque estoy usando un certificado autofirmado
      test: ["CMD", "curl", "-f", "https://localhost/wp-login.php", "--insecure"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "443:443" # El puerto del contenedor se mapea al del host (HOST_PORT:CONTAINER_PORT)
    volumes:
      - wp_vol:/var/www/html # Comparte volumen con wordpress con el contenido de este ultimo
#      - ./requirements/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - inception
    depends_on:
      - wordpress # Hasta que wordpress no este listo no se arrancara nginx

volumes: # Montare carpetas reales del host usando 'bind' dentro del container
  db_vol:
    driver: local
    driver_opts:
      type: none # No se define un sistema de archivos especifico
      device: "/home/${USER}/mydata/db_vol" # directorio del host donde se va a montar
      o: bind # Mapea una carpeta del host a dentro del contenedor.

  wp_vol:
    driver: local
    driver_opts:
      type: none
      device: "/home/${USER}/mydata/wp_vol"
      o: bind

networks:
  inception:
    driver: bridge

