# --------------------------------------------------------
# NGINX CONGIG (default.conf)
#
# Este archivo define los servidores virtuales (virtual hosts)
# gestionados por el contenedor nginx.
#
# - Redirige todo el tráfico HTTP (puerto 80) a HTTPS (puerto 443)
# - Sirve WordPress (jocuni-p.42.fr) estático y dinámico vía PHP-FPM
# - Redirige el dominio miwebestatica.42.fr al contenedor static-website (proxy inverso)
# - Redirige el dominio adminer.42.fr al contenedor adminer (proxy inverso)
# - Utiliza certificados SSL autofirmados comunes para todos los servicios
# - Aplica cabeceras de seguridad HTTPS estándar
# --------------------------------------------------------

# 1. Redirecciona el tráfico HTTP (80) ->  HTTPS (443) para los dominios listados
server {
    listen 80;
    server_name jocuni-p.42.fr miwebestatica.42.fr adminer.42.fr;
    return 301 https://$host$request_uri;
}

# 2. Bloque HTTPS para WordPress (jocuni-p.42.fr)
server {
    listen 443 ssl;
    server_name jocuni-p.42.fr;

#	Ubicacion de los certificados autofirmados
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

# 	Cabeceras de seguridad HTTPS recomendadas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

#	Directorio donde esta el contenido estatico que servira nginx cuando se llame a jocuni-p.42.fr
    root /var/www/html;
    index index.php index.html index.htm; # Orden de busqueda para archivos index

#	Intenta servir archivo estático, si no lo encuentra, reenvía a PHP
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

#	Ejecuta scripts PHP a través de WordPress (PHP-FPM en puerto 9000)	
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

#	Protege archivos ocultos (.htacces, etc.)
    location ~ /\.ht {
        deny all;
    }
}

# 3. Bloque HTTPS para web estática (miwebestatica.42.fr)
server {
    listen 443 ssl;
    server_name miwebestatica.42.fr;

# 	Reutilizo los certificados existentes
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

#	Cabezeras de seguridad para HTTPS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

#	Proxy inverso al contenedor de wed estatica.
#	Redirijo todo el tráfico al contenedor static-website por HTTP interno
    location / {
        proxy_pass http://static-website:80;
    }
}

# 4. Bloque HTTPS para Adminer (adminer.42.fr)
server {
    listen 443 ssl;
    server_name adminer.42.fr;

# 	Certificados SSL autofirmados compartidos
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

# 	Cabeceras de seguridad HTTPS recomendadas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 	Proxy inverso: redirige todas las peticiones al contenedor 'adminer'
    location / {
        proxy_pass http://adminer-web:80;

# 		Cabeceras adicionales para compatibilidad proxy inverso(recomendado)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Resultado:
# http://jocuni-p.42.fr → redirige a https://jocuni-p.42.fr → WordPress
# http://miwebestatica.42.fr → redirige a https://miwebestatica.42.fr → web estática
# http://adminer.42.fr → redirige a https://adminer.42.fr → Adminer

